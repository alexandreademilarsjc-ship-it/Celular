<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; background: #0b0b0d; }
  .card {
    position: relative; width: 1080px; height: 1350px; overflow: hidden;
    background:
      radial-gradient(900px 700px at 85% 18%, rgba(201,162,92,.20), transparent 60%),
      radial-gradient(700px 600px at 0% 100%, rgba(201,162,92,.08), transparent 60%),
      linear-gradient(160deg, #141317 0%, #0b0b0d 55%, #070708 100%);
    color: #f3ece0; font-family: 'Inter', sans-serif;
    padding: 96px 96px 88px;
  }
  .frame { position: absolute; inset: 36px; border: 1px solid rgba(201,162,92,.35); pointer-events: none; }
  .art { position: absolute; right: 0; top: 0; width: 1080px; height: 760px; }
  .tag { font-size: 20px; letter-spacing: .42em; color: #c9a25c; font-weight: 500; }
  h1 {
    font-family: 'Cormorant Garamond', serif; font-weight: 600;
    font-size: 118px; line-height: .98; letter-spacing: -.01em;
    margin-top: 360px; position: relative;
  }
  h1 em { font-style: italic; font-weight: 500; color: #d9b674; }
  .sub { margin-top: 36px; font-size: 30px; line-height: 1.45; font-weight: 300; color: #d8d0c2; max-width: 820px; }
  .sub b { font-weight: 500; color: #f3ece0; }
  .pillars { display: flex; margin-top: 56px; border-top: 1px solid rgba(201,162,92,.35); border-bottom: 1px solid rgba(201,162,92,.35); }
  .pillars div { flex: 1; padding: 26px 0; text-align: center; font-size: 22px; letter-spacing: .14em; text-transform: uppercase; color: #e6dccb; font-weight: 500; }
  .pillars div + div { border-left: 1px solid rgba(201,162,92,.35); }
  .foot { position: absolute; left: 96px; right: 96px; bottom: 92px; display: flex; justify-content: space-between; align-items: flex-end; }
  .name { font-family: 'Cormorant Garamond', serif; font-size: 58px; font-weight: 600; line-height: 1; }
  .role { margin-top: 12px; font-size: 19px; letter-spacing: .32em; color: #c9a25c; font-weight: 500; }
  .phone { text-align: right; }
  .phone small { display: block; font-size: 18px; letter-spacing: .3em; color: #a99f8f; margin-bottom: 10px; }
  .phone span { font-size: 46px; font-weight: 500; letter-spacing: .02em; }
</style>
</head>
<body>
<div class="card">
  <div class="frame"></div>
  <svg class="art" viewBox="0 0 1080 760" fill="none">
    <defs>
      <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="#c9a25c" stop-opacity="0"/>
        <stop offset=".5" stop-color="#c9a25c" stop-opacity=".7"/>
        <stop offset="1" stop-color="#ecd29a"/>
      </linearGradient>
    </defs>
    <!-- trajetória ascendente -->
    <path d="M380 470 C 560 460, 640 420, 730 340 S 900 140, 1000 90" stroke="url(#g)" stroke-width="2.2"/>
    <path d="M420 500 C 600 490, 680 450, 770 380 S 940 200, 1040 150" stroke="#c9a25c" stroke-opacity=".18" stroke-width="1.2"/>
    <!-- borbulhas de champanhe subindo -->
    <g stroke="#d9b674">
      <circle cx="1000" cy="90" r="9" fill="#ecd29a" stroke="none"/>
      <circle cx="1000" cy="90" r="22" stroke-opacity=".5"/>
      <circle cx="930" cy="200" r="6" stroke-opacity=".8"/>
      <circle cx="880" cy="140" r="3.5" stroke-opacity=".7"/>
      <circle cx="960" cy="280" r="10" stroke-opacity=".55"/>
      <circle cx="1010" cy="220" r="4" stroke-opacity=".6"/>
      <circle cx="850" cy="300" r="5" stroke-opacity=".45"/>
      <circle cx="900" cy="380" r="13" stroke-opacity=".35"/>
      <circle cx="990" cy="400" r="5" stroke-opacity=".4"/>
      <circle cx="800" cy="220" r="2.5" stroke-opacity=".6"/>
      <circle cx="1030" cy="330" r="2.5" stroke-opacity=".5"/>
      <circle cx="940" cy="480" r="7" stroke-opacity=".25"/>
      <circle cx="840" cy="440" r="3" stroke-opacity=".3"/>
      <circle cx="760" cy="150" r="2" stroke-opacity=".5"/>
    </g>
  </svg>

  <div class="tag">ADEMICON · CONSÓRCIO</div>

  <h1>Crédito para quem<br>pensa <em>grande.</em></h1>

  <p class="sub">Expanda sua empresa ou amplie seu patrimônio com <b>crédito sem juros</b> e planejamento sob medida.</p>

  <div class="pillars">
    <div>Sem juros</div>
    <div>Expansão</div>
    <div>Patrimônio</div>
  </div>

  <div class="foot">
    <div>
      <div class="name">Raissa Anjos</div>
      <div class="role">CONSULTORA ADEMICON</div>
    </div>
    <div class="phone">
      <small>WHATSAPP</small>
      <span>(12) 99145-5719</span>
    </div>
  </div>
</div>
</body>
</html>
